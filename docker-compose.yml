version: "3.9"

networks:
  todoapp-net:

services:
  mysql:
    image: mysql-local:1.1.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    networks:
      - todoapp-net

  pythonapp:
    image: todoapp:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-app
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: 1
      ENGINE: mysql.connector.django
      NAME: app_db
      USER: app_user
      PASSWORD: 1234
      HOST: mysql
      PORT: 3306
    networks:
      - todoapp-net

volumes:
  todoapp-db-data: