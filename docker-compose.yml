# docker-compose.yml
networks:
  todoapp-net:
services:
  db-migrate:
    image: todoapp:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py migrate  # ПЕРЕЗАПИСУЄМО дефолтну команду на міграції
    env_file:
      - app.env
    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy
    
  pythonapp:
    image: todoapp:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - app.env
    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy
    
    restart: unless-stopped
  mysql:
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    env_file:
      - app.env
    networks:
      - todoapp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  todoapp-db-data:
