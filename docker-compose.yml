version: '3.9'
networks:
  todoapp-net:

services:
  web:
    image: todolist-app:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENGINE: ${ENGINE}
      NAME:   ${NAME}
      USER:   ${USER}
      PASSWORD: ${PASSWORD}
      HOST:   ${HOST}
      PORT:   ${PORT}
      PYTHONUNBUFFERED: "1"
    depends_on:
      - mysql
    networks:
      - todoapp-net
    restart: unless-stopped

  mysql:
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: "1234"
    networks:
      - todoapp-net

volumes:
  todoapp-db-data: