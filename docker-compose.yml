networks:
  todoapp-net:
services:
  pythonapp:
    image: todoapp:2.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENGINE: ${ENGINE:-mysql.connector.django}
      NAME: ${NAME:-app_db}
      USER: ${USER:-app_user}
      PASSWORD: ${PASSWORD:-1234}
      HOST: ${HOST:-mysql}
      PORT: ${PORT:-3306}
    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  mysql:
    image: mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${NAME:-app_db}
      MYSQL_USER: ${USER:-app_user}
      MYSQL_PASSWORD: ${PASSWORD:-1234}
      MYSQL_HOST: ${HOST:-mysql}
      MYSQL_PORT: ${PORT:-3306}

    networks:
      - todoapp-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "app_user",
          "-p ${PASSWORD:-1234}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  todoapp-db-data:
