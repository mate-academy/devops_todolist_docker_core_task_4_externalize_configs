version: '3.8'

networks:
  todoapp-net:

volumes:
  todoapp-db-data:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    volumes:
      - todoapp-db-data:/var/lib/mysql
    networks:
      - todoapp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  pythonapp:
    image: todoapp:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    command: >                                   
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: '1'
      ENGINE: django.db.backends.mysql
      NAME: app_db
      USER: app_user
      PASSWORD: 1234
      HOST: mysql-local                          # Обов’язково — ім’я сервісу або container_name
      PORT: 3306
    volumes:
      - .:/app
    networks:
      - todoapp-net
