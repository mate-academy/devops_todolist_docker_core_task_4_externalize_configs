services:
  db:
    image: mysql:8.0
    container_name: todoapp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: '1234'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    image: todoapp-web:1.0.0
    container_name: todoapp-web
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ENGINE=mysql.connector.django
      - NAME=app_db
      - USER=app_user
      - PASSWORD=1234
      - HOST=db
      - PORT=3306
    depends_on:
      - db

volumes:
  mysql_data:
