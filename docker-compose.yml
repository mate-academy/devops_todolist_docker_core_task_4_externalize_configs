services:
  pythonapp:
    image: todoapp:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      ENGINE: ${ENGINE:-mysql.connector.django}
      NAME: ${NAME:-app_db}
      USER: ${USER:-app_user}
      PASSWORD: ${PASSWORD:-1234}
      HOST: ${HOST:-mysql}
      PORT: ${PORT:-3306}
    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${NAME:-app_db}
      MYSQL_USER: ${USER:-app_user}
      MYSQL_PASSWORD: ${PASSWORD:-1234}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - todoapp-net
    restart: unless-stopped

networks:
  todoapp-net:

volumes:
  todoapp-db-data: