networks:
  todoapp-net:
services:
  pythonapp:
    image: todoapp:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      ENGINE: ${DB_ENGINE:-mysql.connector.django}
      NAME: ${DB_NAME:-app_db}
      USER: ${DB_USER:-app_user}
      PASSWORD: ${DB_PASSWORD:-1234}
      HOST: ${DB_HOST:-mysql}
      PORT: ${DB_PORT:-3306}
    networks:
      - todoapp-net
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
    networks:
      - todoapp-net
volumes:
  todoapp-db-data:
