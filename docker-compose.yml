services:
  db:
    image: mysql:8.0
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: baga56789/todoapp:3.0.0
    ports:
      - "8000:8080"
    depends_on:
      - db
    environment:
      - ENGINE=mysql.connector.django
      - NAME=app_db
      - USER=app_user
      - PASSWORD=1234
      - HOST=db
      - PORT=3306

volumes:
  db_data: