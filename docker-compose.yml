# docker-compose.yml
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: '1234'
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    image: d4vp/todoapp:3.0.0
    container_name: django_app
    ports:
      - "8080:8000"
    depends_on:
      - db
    environment:
      ENGINE: 'mysql.connector.django'
      NAME: 'app_db'
      USER: 'app_user'
      PASSWORD: '1234'
      HOST: 'db'
      PORT: '3306'

volumes:
  mysql_data: