# docker-compose.yml
# version: '3'
networks:
  todoapp-net:
services:
  pythonapp:
    image: todoapp:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - TODO_ENGINE=${TODO_ENGINE:-mysql.connector.django}
      - TODO_NAME=${TODO_NAME:-app_db}
      - TODO_USER=${TODO_USER:-app_user}
      - TODO_PASSWORD=${TODO_PASSWORD:-1234}
      - TODO_HOST=${TODO_HOST:-mysql}
      - TODO_PORT=${TODO_PORT:-3306}
    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  mysql:
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - todoapp-net
volumes:
  todoapp-db-data:
