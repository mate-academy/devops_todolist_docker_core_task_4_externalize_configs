version: '3.8'

services:
  # Django Web Application
  web:
    build: .
    image: django-todolist:1.0.0
    ports:
      - "8000:8000"
    # Environment variables for Django application
    environment:
      - ENGINE=${ENGINE:-django.db.backends.sqlite3}
      - NAME=${NAME:-db.sqlite3}
      - USER=${USER:-}
      - PASSWORD=${PASSWORD:-}
      - HOST=${HOST:-}
      - PORT=${PORT:-}
    volumes:
      - .:/app
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # PostgreSQL Database (used when ENGINE=django.db.backends.postgresql)
  db:
    image: postgres:13
    # Environment variables for PostgreSQL container
    # These are used by PostgreSQL itself, not by Django
    environment:
      - POSTGRES_DB=${DB_NAME:-todolist}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: