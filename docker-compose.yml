version: '3.8'  # Змінено версію

networks:
  todoapp-net:

services:
  pythonapp:
    image: todoapp:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=1234
      - DB_HOST=mysql
      - DB_PORT=3306
    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy  # Виправлений синтаксис
